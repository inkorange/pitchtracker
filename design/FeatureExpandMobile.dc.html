<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Homepage feature cards — tap to expand (mobile)</title>
<script src="./support.js"></script>

<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;1,700;1,800&amp;family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#070B14}
a{color:#F3F5F9;text-decoration:none}a:hover{color:#FF6B7A}
button{font-family:Inter,sans-serif;cursor:pointer}
.draw{stroke-dasharray:100;stroke-dashoffset:100;animation:ptdraw 4.5s ease-out infinite}
.draw:nth-of-type(3n+1){animation-delay:.25s}
.draw:nth-of-type(3n+2){animation-delay:.5s}
.pop{opacity:0;animation:ptpop 4.5s ease-out infinite}
@keyframes ptdraw{0%{stroke-dashoffset:100;opacity:1}35%{stroke-dashoffset:0}85%{stroke-dashoffset:0;opacity:1}100%{stroke-dashoffset:0;opacity:0}}
@keyframes ptpop{0%,30%{opacity:0}42%,85%{opacity:.9}100%{opacity:0}}
@media (prefers-reduced-motion: reduce){.draw{animation:none;stroke-dashoffset:0}.pop{animation:none;opacity:.9}}
</style>
</helmet>
<section style="width: 390px; box-sizing: border-box; padding: 40px 20px; background: #070B14; color: #F3F5F9; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; gap: 12px">
<h2 style="margin: 0 0 4px; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-style: italic; font-size: 40px; line-height: 0.95; text-transform: uppercase">A pitch lab, not a stat table.</h2>
<p style="margin: 0 0 8px; font-size: 14px; color: #9AA6BD">Tap a card to preview it.</p>
<sc-for list="{{ cards }}" as="f" hint-placeholder-count="4">

<button aria-expanded="{{ f.exp }}" onClick="{{ f.toggle }}" style="width: 100%; display: flex; align-items: center; gap: 14px; min-height: 64px; padding: 12px 16px; border: 0; background: transparent; color: #F3F5F9; text-align: left">
<span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 28px; color: #E8364F; line-height: 1">{{ f.n }}</span>
<span style="flex-grow: 1; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 22px; line-height: 1; text-transform: uppercase">{{ f.title }}</span>
<span aria-hidden="true" style="{{ f.chev }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M6 9l6 6 6-6"></path></svg></span>
</button>

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1060}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { open: 0 }; }
  renderVals() {
    const s = this.state;
    const F = [
      { n: '01', title: 'Every pitch in 3D', v: 'scene', body: 'Statcast tracking rebuilt as real flight paths — a whole season of pitches on one field.', cta: 'Open Misiorowski in 3D', href: 'MobileSheetPeek.dc.html', steps: ['Search any pitcher.', 'Pick a camera: Front, Back, Top or Side.', 'Color paths by pitch type or outcome.'] },
      { n: '02', title: 'Tunnels you can see', v: 'tunnel', body: 'See where pitches share a lane out of the hand — and where they split.', cta: 'See his tunnel', href: 'MobileSheetPeek.dc.html', steps: ['Open a pitcher, choose the Tunnel camera.', 'Toggle pitch types in the Arsenal tab.', 'Watch where the paths separate.'] },
      { n: '03', title: 'Arsenal at a glance', v: 'tunnel', body: 'Velocity, usage and counts per pitch — and the list doubles as the scene filter.', cta: 'Explore the arsenal', href: 'MobileSheetPeek.dc.html', steps: ['Open the Arsenal tab in the drawer.', 'Tap a pitch to show or hide it.', 'Narrow by batter side, outcome or game.'] },
      { n: '04', title: 'Replay any at-bat', v: 'tunnel', body: 'Step through a plate appearance pitch by pitch, in the order the hitter saw it.', cta: 'Watch an at-bat', href: 'AtBatMobile.dc.html', steps: ['Open the Games tab and pick a start.', 'Choose an at-bat.', 'Step pitch by pitch with the zone map.'] }
    ];
    const cards = F.map((f, i) => {
      const isOpen = s.open === i;
      return Object.assign({}, f, {
        isOpen, exp: isOpen ? 'true' : 'false', vScene: f.v === 'scene', vOther: f.v !== 'scene',
        steps: f.steps.map((t, k) => ({ i: k + 1, t })),
        toggle: () => this.setState({ open: isOpen ? -1 : i }),
        chev: 'width: 32px; height: 32px; border-radius: 50%; border: 1px solid #2A3650; display: flex; align-items: center; justify-content: center; transition: transform 0.25s; transform: rotate(' + (isOpen ? '180' : '0') + 'deg)',
        wrap: 'border-radius: 6px; overflow: hidden; background: #0F1626; ' + (isOpen ? 'border: 1px solid #2A3650; border-left: 3px solid #E8364F' : 'border: 1px solid #1B2438; border-left: 3px solid #2A3650')
      });
    });
    return { cards };
  }
}
</script>
