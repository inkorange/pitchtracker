<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>PitchTracker — At-bat replay mobile</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;1,700;1,800&amp;family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#070B14}
a{color:#F3F5F9;text-decoration:none}a:hover{color:#FF6B7A}
button{font-family:Inter,sans-serif;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #0A101C; color: #F3F5F9; font-family: Inter, system-ui, sans-serif">

<header style="position: absolute; top: 0; left: 0; right: 0; height: 56px; display: flex; align-items: center; gap: 4px; padding: 0 4px; background: #0A101C; border-bottom: 1px solid #1B2438; z-index: 2">
<a href="MobileSheetPeek.dc.html" aria-label="Exit at-bat" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M6 6l12 12M18 6L6 18"></path></svg></a>
<div style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column">
<span aria-label="Jacob Misiorowski versus Pete Crow-Armstrong" style="display: flex; align-items: baseline; gap: 5px; min-width: 0; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 20px; line-height: 1.1"><span style="flex: 0 1 auto; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis">MISIOROWSKI</span><span style="flex-shrink: 0; color: #9AA6BD; font-weight: 700">vs</span><span style="flex: 0 1 auto; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis">CROW-ARMSTRONG</span></span>
<span style="font-size: 12px; color: #9AA6BD; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">May 19 · MIL @ CHC · AB #42</span>
</div>
<button aria-label="Share at-bat" style="width: 44px; height: 44px; border: 0; background: transparent; color: #F3F5F9; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12M7 8l5-5 5 5M5 14v6h14v-6"></path></svg></button>
</header>

<div style="position: absolute; top: 56px; left: 0; right: 0; height: 520px; overflow: hidden">
<img src="/_blob/6232af7d81a694a91e21900a4a3e99a4" alt="3D pitch scene, catcher view" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover">
<svg aria-hidden="true" viewBox="0 0 390 844" preserveAspectRatio="xMidYMid slice" style="position: absolute; inset: 0; width: 100%; height: 100%">
<sc-for list="{{ trails }}" as="t" hint-placeholder-count="6">
<path d="{{ t.d }}" stroke="{{ t.c }}" stroke-width="{{ t.w }}" stroke-opacity="{{ t.o }}" fill="none" stroke-linecap="round"></path>
<circle cx="{{ t.x }}" cy="{{ t.y }}" r="{{ t.r }}" fill="{{ t.c }}" fill-opacity="{{ t.o }}"></circle>
</sc-for>
</svg>
<div style="position: absolute; top: 12px; left: 12px; display: flex; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 18px; letter-spacing: 0.5px">
<span style="background: #0A101C; padding: 4px 10px">P{{ curN }}/6</span>
<span style="background: #F3F5F9; color: #070B14; padding: 4px 10px">{{ countLabel }}</span>
<span style="background: #E8364F; padding: 4px 10px">{{ curMph }}</span>
</div>
<figure style="position: absolute; top: 12px; right: 12px; margin: 0; background: rgba(7,11,20,0.9); border: 1px solid #2A3650; border-radius: 6px; padding: 6px">
<svg role="img" aria-label="Strike zone with numbered pitch locations" viewBox="0 0 172 200" style="width: 86px; height: 100px; display: block">
<rect x="36" y="30" width="100" height="130" fill="none" stroke="#C4CCDB" stroke-width="2"></rect>
<sc-for list="{{ dots }}" as="d" hint-placeholder-count="6">
<circle cx="{{ d.x }}" cy="{{ d.y }}" r="14" fill="{{ d.c }}" stroke="{{ d.ring }}" stroke-width="3" opacity="{{ d.o }}"></circle>
<text x="{{ d.x }}" y="{{ d.ty }}" text-anchor="middle" font-family="Barlow Condensed, sans-serif" font-weight="700" font-size="18" fill="#070B14" opacity="{{ d.o }}">{{ d.n }}</text>
</sc-for>
</svg>
</figure>
<div style="position: absolute; left: 12px; right: 12px; bottom: 12px; display: flex; background: rgba(7,11,20,0.88); border: 1px solid #2A3650; border-radius: 4px; padding: 3px; font-family: 'Barlow Condensed', sans-serif">
<sc-for list="{{ views }}" as="v" hint-placeholder-count="5">
<button aria-pressed="{{ v.sel }}" onClick="{{ v.pick }}" style="{{ v.style }}">{{ v.label }}</button>
</sc-for>
</div>
</div>

<section aria-label="Pitch sequence" style="position: absolute; left: 0; right: 0; top: 576px; bottom: 0; display: flex; flex-direction: column; border-top: 1px solid #2A3650">
<div style="padding: 14px 16px 10px; border-left: 5px solid {{ curC }}; margin: 12px 16px 0; background: #0F1626; display: flex; flex-direction: column">
<span style="font-size: 11px; letter-spacing: 1.2px; color: #9AA6BD; font-weight: 600">PITCH {{ curN }} · {{ countBefore }} COUNT · SAMPLE</span>
<span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 26px; line-height: 1.05">{{ curType }} · {{ curRes }}</span>
</div>
<div style="display: flex; gap: 8px; padding: 12px 0 12px 16px; overflow-x: auto">
<sc-for list="{{ pitches }}" as="p" hint-placeholder-count="6">
<button onClick="{{ p.pick }}" aria-current="{{ p.cur }}" style="{{ p.card }}">
<span style="display: flex; align-items: center; gap: 6px"><span style="width: 20px; height: 20px; border-radius: 50%; background: {{ p.c }}; color: #070B14; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 13px; display: flex; align-items: center; justify-content: center">{{ p.n }}</span><span style="font-size: 12px; font-weight: 600; white-space: nowrap">{{ p.short }}</span></span>
<span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 20px; line-height: 1">{{ p.mph }}</span>
<span style="font-size: 11px; color: #9AA6BD; white-space: nowrap">{{ p.count }}</span>
</button>
</sc-for>
</div>
<div style="margin-top: auto; padding: 0 16px 20px; display: flex; align-items: center; justify-content: center; gap: 20px">
<button aria-label="Previous pitch" onClick="{{ prev }}" style="width: 48px; height: 48px; border-radius: 50%; border: 1px solid #2A3650; background: transparent; color: #F3F5F9; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h2v14H6zM20 5v14L9 12z"></path></svg></button>
<button aria-label="Play at-bat" style="width: 60px; height: 60px; border-radius: 50%; border: 0; background: #E8364F; color: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M7 4l13 8-13 8z"></path></svg></button>
<button aria-label="Next pitch" onClick="{{ next }}" style="width: 48px; height: 48px; border-radius: 50%; border: 1px solid #2A3650; background: transparent; color: #F3F5F9; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M16 5h2v14h-2zM4 5v14l11-7z"></path></svg></button>
</div>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { cur: 4, view: 'FRONT' }; }
  renderVals() {
    const s = this.state;
    const C = { 'Four-Seam': '#F0505A', 'Slider': '#B392F0', 'Curveball': '#4C8DF6', 'Cutter': '#F5A524' };
    const SH = { 'Four-Seam': '4-Seam', 'Slider': 'Slider', 'Curveball': 'Curve', 'Cutter': 'Cutter' };
    const RS = { 'Called strike': 'Called', 'Swinging strike': 'Whiff', 'Ball': 'Ball', 'Foul': 'Foul' };
    const data = [
      ['Four-Seam', '100.9', 'Called strike', '0-0', '0-1', 0.62, 0.30, -0.05, -0.15],
      ['Slider', '92.4', 'Ball', '0-1', '1-1', 1.15, 0.85, 0.3, 0.05],
      ['Four-Seam', '101.3', 'Foul', '1-1', '1-2', 0.40, 0.12, -0.05, -0.15],
      ['Curveball', '88.6', 'Ball', '1-2', '2-2', 0.55, 1.18, 0.15, 0.35],
      ['Four-Seam', '101.8', 'Foul', '2-2', '2-2', 0.75, 0.05, -0.05, -0.15],
      ['Cutter', '96.1', 'Swinging strike', '2-2', 'K', 0.95, 0.55, 0.12, 0]
    ];
    const rx = 195, ry = 446, x0 = 138, zw = 113, y0 = 455, zh = 161;
    const pitches = data.map((d, i) => {
      const cur = i === s.cur, c = C[d[0]];
      return { n: i + 1, short: SH[d[0]], mph: d[1], count: RS[d[2]] || d[2], c, cur: cur ? 'step' : 'false', pick: () => this.setState({ cur: i }),
        card: 'flex-shrink: 0; width: 100px; min-height: 76px; display: flex; flex-direction: column; align-items: flex-start; gap: 5px; padding: 8px 10px; border-radius: 6px; color: #F3F5F9; text-align: left; opacity: ' + (i > s.cur ? '0.45' : '1') + '; ' + (cur ? 'background: #131C30; border: 1.5px solid ' + c : 'background: #0F1626; border: 1px solid #1B2438') };
    });
    const trails = data.slice(0, s.cur + 1).map((d, i) => {
      const ex = x0 + d[5] * zw, ey = y0 + d[6] * zh;
      const cx = rx + (ex - rx) * 0.55 - d[7] * zw * 0.9, cy = ry + (ey - ry) * 0.35 - d[8] * zh * 0.6 - zh * 0.08;
      const cur = i === s.cur;
      return { d: 'M' + rx + ' ' + ry + ' Q' + cx.toFixed(0) + ' ' + cy.toFixed(0) + ' ' + ex.toFixed(0) + ' ' + ey.toFixed(0), c: C[d[0]], w: cur ? 3.5 : 2, o: cur ? 1 : 0.45, x: ex.toFixed(0), y: ey.toFixed(0), r: cur ? 6 : 4 };
    });
    const dots = data.map((d, i) => { const x = 36 + d[5] * 100, y = 30 + d[6] * 130; return { n: i + 1, x: x.toFixed(0), y: y.toFixed(0), ty: (y + 6).toFixed(0), c: C[d[0]], ring: i === s.cur ? '#FFFFFF' : 'none', o: i <= s.cur ? 1 : 0.2 }; });
    const cd = data[s.cur];
    const views = ['FRONT', 'BACK', 'TOP', 'SIDE', 'TUNNEL'].map((label) => ({ label, sel: s.view === label ? 'true' : 'false', pick: () => this.setState({ view: label }),
      style: 'flex: 1; height: 38px; border: 0; border-radius: 2px; font-family: inherit; font-weight: 700; font-size: 15px; ' + (s.view === label ? 'background: #F3F5F9; color: #070B14' : 'background: transparent; color: #C4CCDB') }));
    return {
      pitches, trails, dots, views,
      curN: s.cur + 1, curMph: cd[1], curType: cd[0].toUpperCase(), curRes: cd[2].toUpperCase(), curC: C[cd[0]], countBefore: cd[3],
      countLabel: cd[4] === 'K' ? 'K' : cd[4],
      prev: () => this.setState({ cur: Math.max(0, s.cur - 1) }),
      next: () => this.setState({ cur: Math.min(5, s.cur + 1) })
    };
  }
}
</script>
</body>
</html>
