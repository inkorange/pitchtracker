<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { view: 'Front', open: false }; }
  renderVals() {
    const s = this.state;
    const views = ['Front', 'Back', 'Top', 'Side', 'Tunnel'].map((label) => ({
      label, sel: s.view === label ? 'true' : 'false', pick: () => this.setState({ view: label, open: false }),
      style: 'width: 100%; height: 44px; border: 0; border-radius: 4px; text-align: left; padding: 0 12px; font-size: 14px; ' + (s.view === label ? 'background: #F3F5F9; color: #070B14; font-weight: 700' : 'background: transparent; color: #F3F5F9; font-weight: 500')
    }));
    return { views, view: s.view, viewOpen: s.open, viewOpenStr: s.open ? 'true' : 'false', toggleView: () => this.setState({ open: !s.open }) };
  }
}
</script>
